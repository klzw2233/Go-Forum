{{define "title"}}设密码{{end}}
{{define "content"}}
<h1>给 {{.Target.DisplayName}} <b class="login">{{.Target.LoginName}}</b> 设密码</h1>
{{if .Error}}<p class="err">{{.Error}}</p>{{end}}
<form method="post" action="/members/{{.Target.ID}}/password">
  <label>新密码 <input type="password" name="password" required autofocus></label>
  <button type="submit">保存</button>
</form>
<p><a href="/members">返回会员</a></p>
{{end}}
